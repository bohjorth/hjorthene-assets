# /etc/nginx/sites-available/assets.hjorthene.dk.conf
#
# Statisk frontend serveres direkte af nginx.
# /api og /auth proxyes videre til Node/Express-backenden (port 4000).
#
# TLS termineres af Cloudflare (Tunnel), så denne server lytter kun på port 80.

server {
    listen 80;
    server_name assets.hjorthene.dk;

    # Store uploads kræver en høj client_max_body_size (match MAX_UPLOAD_SIZE_MB i backend/.env)
    client_max_body_size 512M;

    root /opt/hjorthene-assets/frontend;
    index index.html;

    # Frontend (SPA - statiske filer)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # must-revalidate i stedet for lang "expires": cacher stadig, men browseren
    # tjekker altid om filen er ændret siden sidst (undgår stale CSS/JS efter deploy)
    location /css/ { add_header Cache-Control "public, must-revalidate"; access_log off; }
    location /js/  { add_header Cache-Control "public, must-revalidate"; access_log off; }
    location /img/ { add_header Cache-Control "public, must-revalidate"; access_log off; }

    # API + Auth -> Node backend
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s; # store filer / lange uploads
    }

    location /auth/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
