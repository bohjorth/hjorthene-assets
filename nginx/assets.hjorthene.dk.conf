# /etc/nginx/sites-available/assets.hjorthene.dk.conf
#
# Statisk frontend serveres direkte af nginx.
# /api og /auth proxyes videre til Node/Express-backenden (port 4000).
#
# TLS termineres af Cloudflare (Tunnel), så denne server lytter kun på port 80.

server {
    listen 80;
    server_name assets.hjorthene.dk;

    # Store uploads kræver en høj client_max_body_size (match MAX_UPLOAD_SIZE_MB i backend/.env)
    client_max_body_size 512M;

    root /opt/hjorthene-assets/frontend;
    index index.html;

    # Frontend (SPA - statiske filer)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # must-revalidate i stedet for lang "expires": cacher stadig, men browseren
    # tjekker altid om filen er ændret siden sidst (undgår stale CSS/JS efter deploy)
    location /css/ { add_header Cache-Control "public, must-revalidate"; access_log off; }
    location /js/  { add_header Cache-Control "public, must-revalidate"; access_log off; }
    location /img/ { add_header Cache-Control "public, must-revalidate"; access_log off; }

    # API + Auth -> Node backend
    #
    # X-Forwarded-Proto er hardcodet til "https", IKKE $scheme: $scheme er nginx'
    # EGEN lokale forbindelse (Cloudflare Tunnel taler almindelig HTTP til nginx),
    # ikke browserens oprindelige forbindelse til Cloudflare. Med $scheme ville
    # Node tro forbindelsen var usikker og nægte at sætte Secure-cookies
    # (session/OAuth-state) - se express-session's secure-cookie-dokumentation.
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s; # store filer / lange uploads
    }

    location /auth/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Prometheus-metrics - begrænset til internt netværk (Prometheus scraper
    # sandsynligvis via 192.168.15.197:80 direkte, ikke gennem Cloudflare).
    # Justér IP-rækkerne hvis jeres interne netværk ser anderledes ud.
    location /metrics {
        allow 127.0.0.1;
        allow 192.168.0.0/16;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        deny all;

        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
