# /etc/nginx/sites-available/assets.hjorthene.dk.conf
#
# Statisk frontend serveres direkte af nginx.
# /api og /auth proxyes videre til Node/Express-backenden (port 4000).

server {
    listen 80;
    server_name assets.hjorthene.dk;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name assets.hjorthene.dk;

    ssl_certificate     /etc/letsencrypt/live/assets.hjorthene.dk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/assets.hjorthene.dk/privkey.pem;

    # Store uploads kræver en høj client_max_body_size (match MAX_UPLOAD_SIZE_MB i backend/.env)
    client_max_body_size 512M;

    root /var/www/hjorthene-assets/frontend;
    index index.html;

    # Frontend (SPA - statiske filer)
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /css/ { expires 30d; access_log off; }
    location /js/  { expires 30d; access_log off; }

    # API + Auth -> Node backend
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s; # store filer / lange uploads
    }

    location /auth/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
