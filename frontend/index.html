<!doctype html>
<html lang="da">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hjorthene Assets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="img/logo-icon.png" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="login-screen" class="login-screen hidden">
  <div class="login-card">
    <img src="img/logo-full.jpg" alt="Hjorthene" class="login-logo" />
    <h1>Assets</h1>
    <p>Log ind for at få adgang til jeres filarkiv.</p>
    <button id="login-btn" class="btn btn-primary btn-block">Log ind med Authentik</button>
  </div>
</div>

<div id="app" class="app hidden">
  <aside class="sidebar">
    <div class="brand">
      <img src="img/logo-icon.png" alt="" class="brand-mark" />
      <span class="brand-name">Hjorthene<br><span class="brand-sub">Assets</span></span>
    </div>

    <nav class="nav">
      <button class="nav-item" data-view="dashboard"><span class="nav-icon">◆</span>Dashboard</button>
      <button class="nav-item" data-view="assets"><span class="nav-icon">▤</span>Assets</button>
      <button class="nav-item" data-view="collections"><span class="nav-icon">✦</span>Collections</button>
      <button class="nav-item admin-only" data-view="settings"><span class="nav-icon">⚙</span>Indstillinger</button>
      <button class="nav-item admin-only" data-view="admin"><span class="nav-icon">▣</span>Administration</button>
    </nav>

    <div class="sidebar-footer">
      <div class="user-chip">
        <div class="user-avatar" id="user-avatar">?</div>
        <div class="user-meta">
          <div class="user-name" id="user-name">—</div>
          <div class="user-role" id="user-role">—</div>
        </div>
      </div>
      <button id="logout-btn" class="btn btn-ghost btn-sm btn-block">Log ud</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div id="breadcrumb" class="breadcrumb"></div>
      <div class="topbar-search">
        <input id="global-search" type="text" placeholder="Søg på navn, tags, mappe, kategori, filtype…" />
      </div>
    </header>

    <div id="view-root" class="view-root"></div>
  </main>
</div>

<div id="toast-root" class="toast-root"></div>
<div id="modal-root"></div>

<script src="js/api.js"></script>
<script src="js/util.js"></script>
<script src="js/views/dashboard.js"></script>
<script src="js/views/assets.js"></script>
<script src="js/views/collections.js"></script>
<script src="js/views/settings.js"></script>
<script src="js/views/admin.js"></script>
<script src="js/app.js"></script>
</body>
</html>
